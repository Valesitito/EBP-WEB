<html lang="es-MX">

      as="font"
      type="font/woff2"

    />

      rel="preload"
      href="/fonts/cormorant-garamond-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

      rel="preload"
      as="image"
      href="/hero/head3-1280.webp"
      imagesrcset="/hero/head3-768.webp 768w, /hero/head3-1280.webp 1280w"
      imagesizes="(min-width: 768px) 50vw, 100vw"
    />
  </head>
